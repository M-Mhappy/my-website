name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 47.103.197.64
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "./*"
          target: "/var/www/my-website/"
          strip_components: 1
          overwrite: true
          rm: false

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 47.103.197.64
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            curl -sf http://localhost/ > /dev/null && echo "✅ Deployment verified" || echo "❌ Verification failed"