name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package site with tar
        run: tar czf site-deploy.tar.gz --exclude='.git' --exclude='.github' --exclude='site-deploy.tar.gz' .

      - name: Copy tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 47.103.197.64
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "site-deploy.tar.gz"
          target: "/tmp/"
          strip_components: 0
          overwrite: true

      - name: Extract on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 47.103.197.64
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/my-website
            find . -maxdepth 1 ! -name '.' ! -name 'my-website-deploy.zip' -exec rm -rf {} +
            tar xzf /tmp/site-deploy.tar.gz -C /var/www/my-website/
            rm -f /tmp/site-deploy.tar.gz
            echo "✅ Deployed at $(date)"
            curl -sf http://localhost/ > /dev/null && echo "✅ Site accessible" || echo "❌ Site check failed"