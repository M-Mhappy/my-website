# Nginx 站点配置参考（用于云服务器 Docker nginx）
# 用法：
#   1. 将本文件复制到服务器 /etc/nginx/conf.d/my-website.conf（Docker 容器内）或宿主机 nginx 配置目录
#   2. 确认 nginx.conf 顶层有 `include mime.types;`（官方默认自带，保证 .mp3 -> audio/mpeg）
#   3. nginx -t && nginx -s reload（容器内：docker exec <容器名> nginx -s reload）
#
# 注意：如果 nginx 跑在 Docker 里，必须把宿主机 /var/www/my-website 挂载进容器，
# 例如 docker run -v /var/www/my-website:/usr/share/nginx/html:ro ...
# 且 CI 解压目标是宿主机路径 /var/www/my-website，两者要保持一致。

server {
    listen 80;
    # 有域名就填域名；没有就留 IP
    server_name 47.103.197.64;

    root /var/www/my-website;
    index index.html;

    # 中文文件名必须用 UTF-8，否则 %E5%91%A8... 这类 URL 解码后找不到文件
    charset utf-8;

    # 媒体文件正确的 MIME 类型（nginx 默认 mime.types 已含 audio/mpeg mp3，
    # 这里显式声明双保险，避免 mp3 被当成 application/octet-stream 导致浏览器拒绝播放）
    types {
        audio/mpeg           mp3;
        audio/wav            wav;
        audio/ogg            ogg oga;
        video/mp4            mp4;
        image/jpeg           jpg jpeg;
        image/png            png;
        image/webp           webp;
        image/avif           avif;
        text/css             css;
        application/javascript js mjs;
        application/json     json;
        image/x-icon         ico;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源长缓存（文件名不变的内容）
    location ~* \.(mp3|wav|ogg|mp4|jpg|jpeg|png|webp|avif|js|css|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 音频文件不 gzip（压缩无效还费 CPU），这里显式关闭避免大文件卡顿
    gzip off;
    gzip_vary off;

    access_log /var/log/nginx/my-website.access.log;
    error_log  /var/log/nginx/my-website.error.log;
}
